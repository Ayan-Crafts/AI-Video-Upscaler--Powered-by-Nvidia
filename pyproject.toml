[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-upscaler-studio"
version = "1.0.0"
description = "AI Upscaler Studio - Powered by NVIDIA: AI video interpolation and upscaling desktop studio"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PySide6>=6.7,<7", "psutil>=5.9"]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.535"]
ai = ["numpy>=1.26,<3"]
# Do not install this extra into an NVIDIA environment unless the selected
# PyTorch wheel index is configured explicitly. Prefer the CUDA wheel command
# in docs/AI_PIPELINE.md to avoid replacing CUDA PyTorch with a CPU wheel.
ml = ["torch>=2.4", "torchvision>=0.19"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "coverage>=7"]
# Exact versions bundled into the V1 installers: packaging/requirements/runtime.txt

[project.scripts]
ai-upscaler-studio = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
