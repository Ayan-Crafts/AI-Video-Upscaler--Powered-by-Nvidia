# Builds the Windows x64 installer and portable ZIP on a clean GitHub runner.
# The runner has no NVIDIA GPU, so the packaged self-test verifies the bundled
# runtime, Qt and FFmpeg only; CUDA inference must be validated on real hardware.
# Artifacts only; this workflow never creates tags or releases.
name: Build Windows packages

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths: ["app/**", "packaging/**", "tests/**", ".github/workflows/build-windows.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned uv
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uv==0.11.28
      - name: Install Inno Setup 6.7.3 if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.7.3 --no-progress -y
          }
      - name: Build installer and portable ZIP
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-upscaler-studio-windows-x64
          path: |
            dist/release/*Windows*
            dist/release/BUILD_MANIFEST-windows-x64.json
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build-reports
          path: build/windows/*.json
          retention-days: 14
